image boot.vfat {
	vfat {
		extraargs = "-n boot"
                files = {
                        "active", "boot.scr"
                }
                file slot1/zImage {
                        image = "slot1/zImage"
                }
                file slot1/sun8i-h2-plus-orangepi-zero.dtb {
                        image = "slot1/sun8i-h2-plus-orangepi-zero.dtb"
                }
                file slot1/version.txt {
                        image = "slot1/version.txt"
                }
                file slot2/zImage {
                        image = "slot2/zImage"
                }
                file slot2/sun8i-h2-plus-orangepi-zero.dtb {
                        image = "slot2/sun8i-h2-plus-orangepi-zero.dtb"
                }
                file slot2/version.txt {
                        image = "slot2/version.txt"
                }
                label = "boot"
        }
        size = 32M
}

image sdcard.img {
        hdimage {
		gpt = "true"
		gpt-location = 15M
		align = 1M
        }
	partition u-boot {
                in-partition-table = "no"
                image = "u-boot-sunxi-with-spl.bin"
                offset = 8192
                size = 1040384 # 1MB - 8192
        }
	partition boot {
                partition-type-uuid  = F
                bootable = "true"
                image = "boot.vfat"
		size=32M
        }
        partition rootfs1 {
                partition-type-uuid = L
                image = "rootfs.ext2"
                size = 750M
        }
        partition rootfs2 {
                partition-type-uuid = L
                image = "rootfs.ext2_slot2"
                size=750M
        }
        partition data {
                partition-type-uuid = L
                image = "data.ext4"
        }
}
