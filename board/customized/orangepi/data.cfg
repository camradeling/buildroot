# The data partition ships as a 100M filesystem and expandfs.sh grows it to fill
# the card on first boot. How far it can be grown is decided *here*, at mke2fs
# time, not there: the resize inode reserves a fixed number of GDT blocks, and
# resize2fs cannot go past what they describe. mke2fs defaults that reserve to
# 1024x the initial size - 100 GiB from a 100M filesystem - so growing onto a
# 119 GiB card failed just short of it, with a message that names neither the
# limit nor the fix:
#
#   resize2fs: Illegal doubly indirect block found while trying to resize
#
# and left the card with a 100M filesystem inside a 117.5G partition.
#
# -E resize=1073741824 (blocks, so 4 TiB at -b 4096) reserves 511 GDT blocks
# instead of 12. That costs 2 MiB in a 100M image that still has 87M free, and it
# is the whole cost of never hitting this again on any card that exists. The
# ceiling on the reserve itself is the resize inode's doubly-indirect block, i.e.
# 1024 GDT blocks, so this is not near anything.
image data.ext4{
        ext4{
		extraargs = "-b 4096 -o Linux -E resize=1073741824"
		label = "data"
        }
        size = 100M
}
