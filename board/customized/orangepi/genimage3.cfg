image boot.vfat {
	vfat {
		extraargs = "-n boot"
                files = {
                        "bootok", "boot.scr"
                }
                file default/Image {
                        image = "default/Image"
                }
                file default/sun50i-h618-orangepi-zero3.dtb {
                        image = "default/sun50i-h618-orangepi-zero3.dtb"
                }
                file default/version.txt {
                        image = "default/version.txt"
                }
                file updated/Image {
                        image = "updated/Image"
                }
                file updated/sun50i-h618-orangepi-zero3.dtb {
                        image = "updated/sun50i-h618-orangepi-zero3.dtb"
                }
                file updated/version.txt {
                        image = "updated/version.txt"
                }
                label = "boot"
        }
        size = 150M
}

image sdcard.img {
        hdimage {
		gpt = "true"
		gpt-location = 15M
		align = 1M
        }
	partition u-boot {
                in-partition-table = "no"
                image = "u-boot-sunxi-with-spl.bin"
                offset = 8192
                size = 1040384 # 1MB - 8192
        }
	partition boot {
                partition-type-uuid  = F
                bootable = "true"
                image = "boot.vfat"
		size=150M
        }
        partition rootfs_ro {
                partition-type-uuid = L
                image = "rootfs.ext2_recovery"
                size = 750M
        }
        partition rootfs_new {
                partition-type-uuid = L
                image = "rootfs.ext2"
                size=750M
        }
        partition data {
                partition-type-uuid = L
                image = "data.ext4"
        }
}
