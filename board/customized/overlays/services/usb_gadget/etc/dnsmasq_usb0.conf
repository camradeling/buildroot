interface=usb0
listen-address=192.168.100.1
except-interface=lo
bind-interfaces
# The LANs are IPv4-only: an AAAA answer is unusable here, and on a censored
# uplink it is often forged anyway (e.g. 2001::1). Clients go straight to IPv4.
filter-AAAA
dhcp-range=192.168.100.2,192.168.100.127,12h
dhcp-host=42:63:65:13:34:56,192.168.100.75
