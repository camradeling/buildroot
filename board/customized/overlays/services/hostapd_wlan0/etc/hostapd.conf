ctrl_interface=/var/run/hostapd
interface=wlan0
driver=nl80211
ssid=maloc
## hw_mode has to be explicit: hostapd's built-in default is "b", so with the
## line absent it reported hw_mode=b, ieee80211n=0 and advertised
## supported_rates=1/2/5.5/11 only. "g" is the 2.4 GHz value and the right default
## for channel=6; 0010-wifi_ap_service.sh rewrites it to "a" for a 5 GHz channel.
##
## This is a config-correctness fix, NOT a throughput fix, and the difference
## matters if you are chasing a performance problem. On this board's driver the
## PHY negotiated 802.11n HT20 MCS 7 short GI (72.2 Mbit/s) with a client anyway,
## while hostapd still said hw_mode=b/ieee80211n=0 - rate control lives in the
## driver here and does not follow what hostapd advertises. A measured A/B of
## these settings moved 20 MB over the air in 5.2 s either way (~30 Mbit/s, and
## that ceiling is the board's CPU, not the radio). So do not expect this to
## change link speed on this hardware; it makes the advertised capabilities honest
## and portable to drivers that DO obey them, and turns on WMM.
hw_mode=g
channel=6
## WMM gives the four QoS access categories, so video is not queued behind bulk
## traffic on a shared half-duplex medium. hostapd normally implies this from
## ieee80211n=1; set it explicitly so it does not depend on that inference.
## No ht_capab on purpose: hostapd refuses to start if ht_capab names a capability
## the radio lacks, and the mandatory MCS 0-7 set is what this hardware already
## negotiates without it.
ieee80211n=1
wmm_enabled=1
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
## No wpa_pairwise: wpa=2 uses rsn_pairwise only, so the TKIP that used to sit
## here was dead config - but it is a trap, because TKIP anywhere in the active
## cipher set bars HT outright, so enabling WPA1 later would quietly undo
## ieee80211n=1 above.
rsn_pairwise=CCMP
auth_algs=3
utf8_ssid=1
macaddr_acl=0
deny_mac_file=/etc/hostapd.deny
bss_transition=0
