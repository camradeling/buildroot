# TPROXY reply path.
#
# A packet TPROXY'd to a socket on lo arrives on a LAN interface with a source
# address that does not belong to that interface's subnet, and the reply leaves
# with a source address the routing table would not have chosen. Strict reverse
# path filtering (rp_filter=1) drops exactly that. 2 is the loose form: the source
# only has to be reachable through *some* interface.
#
# Measured on the running board: all=0, default=2, and every live interface 2, so
# the effective value - the kernel takes max(all, per-interface) - is the loose
# form everywhere and the uplink works. Note that the all=2 line below is not what
# produces that: systemd's /usr/lib/sysctl.d/50-default.conf is applied after this
# file (50 > 30) and owns "net.ipv4.conf.*.rp_filter = 2" while excluding
# net.ipv4.conf.all, which is why all reads 0. Both lines stay anyway: they cost
# nothing and they are what keeps a future kernel or package default of 1 from
# silently breaking the LAN's uplink. If that ever needs to win outright, the file
# has to sort after 50-default.conf.
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
