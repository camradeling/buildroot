# sysctl.conf's disable_ipv6 does nothing on a kernel with CONFIG_IPV6=m: the
# sysctls do not exist until the module loads, and it loads later (wireguard
# pulls it in), after systemd-sysctl has run - so every interface came up with
# IPv6 on. As a module option it applies the moment the module loads. The
# module itself still loads, so the modules that depend on it keep working.
options ipv6 disable_ipv6=1
